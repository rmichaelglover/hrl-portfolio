<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Two horizons, one coast</title>
<desc id="desc">A warm sunrise over Chula Vista and a coral sunset over Tijuana, joined by a blue coastal sound wave.</desc>
