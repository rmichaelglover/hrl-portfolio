  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#216681"/><stop offset="1" stop-color="#132e4a"/></linearGradient>
  <linearGradient id="gold" x2="1"><stop stop-color="#ffe0a0"/><stop offset="1" stop-color="#ff9c78"/></linearGradient>
  <linearGradient id="wave"><stop stop-color="#ffe2a3"/><stop offset=".52" stop-color="#b8eaff"/><stop offset="1" stop-color="#ffab89"/></linearGradient>
</defs>
