<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodland Chess Reader</title><style>:root{--bg:#10131c;--panel:#1b2130;--ink:#f5f2e9;--muted:#b8bdc9;--gold:#f0c36a;--line:#3b455a;--green:#8de0b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 50% 0,#28354a,#10131c 65%);color:var(--ink);font:17px/1.72 system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 20px 72px}a{color:var(--green)}header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}.eyebrow{color:var(--gold);font:700 12px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}h1{font:700 clamp(36px,8vw,72px)/1 Georgia,serif;margin:18px 0 6px}h2{color:var(--gold);font:600 27px/1.2 Georgia,serif;margin-top:34px}h3{color:var(--green);font-size:20px}p{color:var(--muted)}li{color:var(--muted);margin:6px 0}blockquote{margin:22px 0;padding:14px 18px;border-left:3px solid var(--gold);background:#1b2130;color:var(--ink)}code,pre{background:#0b0e15;border:1px solid var(--line);border-radius:8px;padding:2px 5px;color:#f0c36a}pre{padding:14px;overflow:auto}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tools a,.tools button{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:8px 13px;text-decoration:none;font:inherit;cursor:pointer}.tools a:hover,.tools button:hover{border-color:var(--gold)}.error{color:#ffaaaa}</style></head><body><main class="wrap"><header><a href="../../chess/">← Chess Worlds</a><div class="eyebrow">Woodland Chess Library</div><h1 id="title">Loading…</h1><p id="meta">A readable browser edition of the source novella.</p><div class="tools"><button id="smaller">A−</button><button id="larger">A+</button><a id="raw" href="#">Open source Markdown</a></div></header><article id="content"><p>Loading the chapter…</p></article></main><script>const qs=new URLSearchParams(location.search),doc=qs.get('doc')||'TWEEN-EDITION.md',title=document.querySelector('#title'),content=document.querySelector('#content'),raw=document.querySelector('#raw');raw.href=doc;const names={'THE-GOLDEN-APPLE.md':'The Golden Apple','TWEEN-EDITION.md':'The Woodland Losers','CHOOSE-YOUR-OWN-ADVENTURE.md':'Master Board Adventure','WOODLAND-CHRONICLES-ATTACK-OF-THE-NARNIAN-CLONES.md':'Woodland Chronicles'};title.textContent=names[doc]||'Woodland Chess Chapter';function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(md){let out='',para=[];const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}};function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>')}for(const line of md.split(/\r?\n/)){if(/^```/.test(line)){flush();out+='<pre>';continue}if(line.trim()===''){flush();continue}if(/^# /.test(line)){flush();out+='<h2>'+inline(line.slice(2))+'</h2>';continue}if(/^## /.test(line)){flush();out+='<h3>'+inline(line.slice(3))+'</h3>';continue}if(/^> /.test(line)){flush();out+='<blockquote>'+inline(line.slice(2))+'</blockquote>';continue}if(/^[-*] /.test(line)){flush();out+='<ul><li>'+inline(line.slice(2))+'</li></ul>';continue}if(/^```/.test(line)){out+='</pre>';continue}para.push(line)}flush();content.innerHTML=out}fetch(doc).then(r=>r.ok?r.text():Promise.reject(new Error('Chapter not found'))).then(render).catch(e=>content.innerHTML='<p class="error">This chapter could not be loaded. <a href="'+doc+'">Open the source file directly.</a></p>');document.querySelector('#smaller').onclick=()=>document.body.style.fontSize='15px';document.querySelector('#larger').onclick=()=>document.body.style.fontSize='20px';</script></body></html>
