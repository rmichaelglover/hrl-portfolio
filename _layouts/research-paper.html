<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A theoretical framework linking scalar and tensor channels, magnetic charge, black-hole structure, dark-sector cosmology, and information.">
  <title>{{ page.title }} | Michael Emanuel Glover</title>
  <style>
    :root{color-scheme:light;--ink:#172b3a;--muted:#526574;--paper:#fff;--canvas:#eef2f3;--line:#d5dee4;--blue:#145c83;--gold:#a66b18;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:18px/1.78 var(--serif)}
    .top{background:#122838;color:#e8f0f3;padding:13px max(22px,calc((100vw - 920px)/2));font:14px/1.5 var(--sans)}.top a{color:#c4e8f3;text-decoration-thickness:1px;text-underline-offset:3px}
    main{max-width:920px;margin:34px auto 70px;padding:clamp(24px,5vw,64px);background:var(--paper);box-shadow:0 10px 40px #162d3b12}
    .status{display:inline-block;margin:0 0 18px;padding:5px 10px;border:1px solid #9ab8c8;border-radius:99px;color:#164461;background:#f2f8fb;font:700 11px/1.5 var(--sans);letter-spacing:.09em;text-transform:uppercase}
    h1,h2,h3,h4{color:#142b3b;line-height:1.25}h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.035em;margin:.2em 0 .25em}h2{margin-top:2.1em;padding-top:.35em;border-top:1px solid var(--line);font-size:clamp(25px,4vw,34px)}h3{margin-top:1.8em;font-size:23px}h4{font-size:19px}
    p{margin:1em 0}a{color:var(--blue);text-underline-offset:3px}blockquote{margin:1.5em 0;padding:12px 22px;border-left:4px solid #b17a2d;background:#fbf7ef;color:#263a48}
    table{width:100%;border-collapse:collapse;margin:1.5em 0;font-size:.91em;line-height:1.55}th,td{padding:10px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:#edf3f5}
    ul,ol{padding-left:1.45em}li{margin:.38em 0}hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
    code{font: .86em ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1f4f6;padding:.1em .28em;border-radius:3px}pre{overflow:auto;padding:16px;background:#f1f4f6;border:1px solid var(--line)}pre code{padding:0;background:none}
    .MathJax{font-size:1.04em!important}.MathJax_Display{overflow-x:auto;overflow-y:hidden;padding:.25em 0}
    .foot{margin-top:3em;padding-top:1em;border-top:1px solid var(--line);font:13px/1.65 var(--sans);color:var(--muted)}
    @media(max-width:650px){body{font-size:17px}main{margin:0;padding:26px 21px 48px;box-shadow:none}table{display:block;overflow-x:auto;white-space:normal}.top{padding:12px 20px}}
    @media print{body{background:#fff;font-size:11pt}main{max-width:none;margin:0;padding:0;box-shadow:none}.top{display:none}h2,h3{break-after:avoid}table,blockquote,pre{break-inside:avoid}a{color:inherit;text-decoration:none}.status{border-color:#777;color:#222;background:#fff}}
  </style>
  <script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],processEscapes:true},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="top"><a href="/hrl-portfolio/">HRL Portfolio</a> &nbsp;›&nbsp; <a href="/hrl-portfolio/research-whitepapers/">Research White Papers</a></div>
  <main>
    <p class="status">Theoretical framework · Working paper</p>
    {{ content }}
    <div class="foot">The paper distinguishes established results, framework postulates, and proposed empirical tests. Mathematical notation is rendered with MathJax when available.</div>
  </main>
</body>
</html>
