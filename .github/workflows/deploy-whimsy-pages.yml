name: Deploy HRL Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: hrl-portfolio-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Stage the complete portfolio
        run: |
          rm -rf public || true
          mkdir -p public
          git archive --format=tar HEAD | tar -xf - -C public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # Use the actions bot identity for the commit
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
