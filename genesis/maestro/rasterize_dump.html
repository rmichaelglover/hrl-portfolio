<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="j">pending</pre>
<script>
  // Bake every cast emoji into a pixel model {char: [[px,py,r,g,b],...]} for the Node exporters.
  const N=18;
  function rz(ch){
    const cv=document.createElement("canvas"); cv.width=cv.height=N;
    const g=cv.getContext("2d",{willReadFrequently:true});
    g.clearRect(0,0,N,N); g.textAlign="center"; g.textBaseline="middle";
    g.font=(N-3)+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
    g.fillText(ch,N/2,N/2+1);
    const d=g.getImageData(0,0,N,N).data, v=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y*N+x)*4; if(d[i+3]>70) v.push([x,y,d[i],d[i+1],d[i+2]]);}
    return v;
  }
  const CHARS=["🏰","🦄","🛕","🐲","🦁","🧙","🐎","🧱","🦊","🦡","🦝","🦌","🦉","🐸","🦎","🦔",
    "🏯","🦏","🔮","👸","🤴","💎","🐘","🗼","🤠","🥳","🧔","🔺","📢","💃","🏁","🏨"];
  const out={N:N,models:{}};
  for(const c of CHARS) out.models[c]=rz(c);
  document.getElementById("j").textContent=JSON.stringify(out);
</script>
</body></html>
